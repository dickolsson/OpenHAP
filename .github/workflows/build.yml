name: Build

# Every merged commit proves that the package still builds, and the
# result stays on the workflow run as an artifact for inspection.
# Nothing here releases: a release is a deliberate act, made by
# pushing a v<MAJOR>.<MINOR>.<PATCH> tag, which the Release workflow
# answers.
on:
  workflow_run:
    # The test suite gates builds. The same suite filters this
    # workflow, because workflow_run takes no paths of its own.
    workflows: ["Test"]
    types:
      - completed
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build version comes from the latest v* tag.
          fetch-depth: 0

      - name: Build the release archive
        run: make build

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhap-package
          path: build/openhap-*.tar.gz
