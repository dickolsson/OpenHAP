name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tidy:
    name: Tidy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./.github/actions/setup-perl

      - name: Install test dependencies
        run: make deps-test

      - name: Check formatting
        run: make tidy

  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown/JSON/YAML formatting
        run: make prettier

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: ./.github/actions/setup-perl

      - name: Install test dependencies
        run: make deps-test

      - name: Check lint
        run: make lint

      - name: Check Perl syntax
        run: |
          find lib -name "*.pm" -exec perl -I lib -cw {} \;
          find bin -type f -exec perl -I lib -cw {} \;
